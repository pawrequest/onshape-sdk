[project]
name = "onshape-sdk-pr"
version = "0.1.4"
description = "A lightweight, typed Python SDK for the Onshape REST API"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Zach Sharma", email = "zachariah.sharma@gmail.com" },
    { name = "PawRequest", email = "nomail@gmail.com" }
]
keywords = ["onshape", "cad", "api", "sdk", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/pawrequest/onshape-sdk"

[project.scripts]
onshape-sdk = "onshape_sdk.main:main"


[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "onshape_sdk"
